<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Закон сохранения импульса</title>
<style>
  * { box-sizing: border-box; }
  
  body {
    margin: 0; padding: 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #1e3a52 0%, #3b5a7a 45%, #7a9bbd 100%);
    min-height: 100vh;
    color: #1a202c;
    position: relative;
  }

  h1 {
    text-align: center; margin: 0 0 18px; font-size: 28px; font-weight: 800;
    background: linear-gradient(to right, #ffffff, #a0c4ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    letter-spacing: 0.5px;
  }

  .layout {
    max-width: 1420px; margin: 0 auto;
    display: flex; gap: 16px; align-items: flex-start;
  }
  .main-col { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .side-col { flex: 0 0 280px; display: flex; flex-direction: column; gap: 14px; }

  .card {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 16px;
    padding: 16px 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1), 0 2px 8px rgba(0,0,0,0.05);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover {
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15), 0 4px 12px rgba(0,0,0,0.08);
  }

  .val, b, .after-speed b {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }

  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  
  button {
    padding: 10px 24px; font-size: 15px; font-weight: 600;
    border: none; border-radius: 10px; cursor: pointer;
    color: #fff; 
    background: linear-gradient(135deg, #2b6cb0 0%, #1a4f85 100%);
    box-shadow: 0 4px 12px rgba(43, 108, 176, 0.3);
    transition: all 0.2s ease;
  }
  button:hover { 
    transform: translateY(-2px); 
    box-shadow: 0 6px 16px rgba(43, 108, 176, 0.4);
  }
  button:active { transform: translateY(0) scale(0.98); }
  button:disabled { 
    background: linear-gradient(135deg, #a0aec0 0%, #718096 100%); 
    box-shadow: none; cursor: default; transform: none; 
  }
  button.reset { 
    background: linear-gradient(135deg, #718096 0%, #4a5568 100%); 
    box-shadow: 0 4px 12px rgba(113, 128, 150, 0.3);
  }
  button.reset:hover { 
    box-shadow: 0 6px 16px rgba(113, 128, 150, 0.4); 
  }

  button.icon-btn {
    padding: 9px 14px;
    font-size: 18px;
    line-height: 1;
    background: rgba(255,255,255,0.55);
    color: #2b6cb0;
    box-shadow: none;
    border: 1px solid rgba(43,108,176,0.25);
    min-width: 44px;
  }
  button.icon-btn:hover {
    background: rgba(255,255,255,0.85);
    box-shadow: none;
    transform: translateY(-1px);
  }
  button.icon-btn.off {
    color: #a0aec0;
    background: rgba(255,255,255,0.35);
    border-color: rgba(113, 128, 150, 0.3);
  }

  .switch { display: flex; border-radius: 10px; overflow: hidden; border: 2px solid #2b6cb0; width: 100%; margin-top: 8px; }
  .switch button {
    border-radius: 0; background: rgba(255,255,255,0.5); color: #2b6cb0;
    padding: 8px 0; font-size: 14px; flex: 1; text-align: center;
    box-shadow: none; transform: none;
  }
  .switch button:hover { background: rgba(255,255,255,0.8); transform: none; box-shadow: none; }
  .switch button.active { background: #2b6cb0; color: #fff; }
  .switch button:not(:last-child) { border-right: 1px solid rgba(43, 108, 176, 0.3); }

  .slow {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 600; color: #2d3748;
    cursor: pointer; user-select: none;
  }
  .slow input { cursor: pointer; width: 16px; height: 16px; }

  canvas {
    display: block; width: 100%; border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    background: #c8dae8;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.4);
  }

  .slider-block { display: flex; flex-direction: column; gap: 14px; }
  .slider-title {
    font-size: 16px; font-weight: 700; margin: 0 0 4px;
    padding-bottom: 8px; border-bottom: 2px solid currentColor;
  }
  .slider-title.red { color: #c53030; }
  .slider-title.green { color: #38a169; }

  .slider-row { display: flex; flex-direction: column; gap: 4px; }
  .slider-row .label {
    font-size: 13px; color: #4a5568; font-weight: 600;
    display: flex; justify-content: space-between;
  }
  .slider-row .label .val { color: #2b6cb0; font-weight: 700; }

  input[type=range] {
    -webkit-appearance: none; width: 100%; background: transparent; margin: 8px 0;
  }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track {
    width: 100%; height: 6px; cursor: pointer;
    background: rgba(0, 0, 0, 0.08); border-radius: 3px;
  }
  input[type=range]::-webkit-slider-thumb {
    height: 20px; width: 20px; border-radius: 50%;
    background: #2b6cb0; cursor: pointer; -webkit-appearance: none;
    margin-top: -7px; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    border: 2px solid #fff; transition: transform 0.15s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }
  
  #m1::-webkit-slider-thumb, #v1::-webkit-slider-thumb { background: #e53e3e; }
  #m2::-webkit-slider-thumb, #v2::-webkit-slider-thumb { background: #38a169; }

  .after-speed {
    font-size: 14px; color: #4a5568;
    padding: 10px 12px; border-radius: 8px;
    background: rgba(237, 242, 247, 0.8); margin-top: 6px;
    line-height: 1.4; border: 1px solid rgba(255,255,255,0.5);
  }
  .after-speed b { color: #2b6cb0; font-size: 16px; display: inline-block; }

  .mode-block { margin-top: 6px; display: flex; flex-direction: column; gap: 6px; }
  .mode-block .mode-label { font-size: 13px; color: #4a5568; font-weight: 600; }

  .bottom-info-card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
  }
  .status {
    text-align: center; font-size: 15px; color: #1a365d;
    font-weight: 600; min-height: 20px; padding: 4px 0;
  }
  .momentum-row {
    font-size: 14px;
    color: #2d3748;
    font-weight: 600;
    white-space: nowrap;
    text-align: center;
    background: rgba(237, 242, 247, 0.6);
    padding: 10px 20px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.6);
  }
  .momentum-row b {
    color: #2b6cb0;
    font-size: 15px;
  }

  .watermark {
    position: fixed;
    bottom: 14px;
    right: 18px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.75);
    letter-spacing: 0.8px;
    pointer-events: none;
    z-index: 1000;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
  }

  @media (max-width: 1000px) {
    .layout { flex-direction: column; }
    .side-col { flex: 1 1 auto; width: 100%; flex-direction: row; flex-wrap: wrap; }
    .side-col > .card { flex: 1 1 260px; }
  }
  
  @media (max-width: 650px) {
    .momentum-row {
      white-space: normal;
      text-align: left;
      line-height: 1.6;
    }
  }
</style>
</head>
<body>
<h1>Закон сохранения импульса</h1>

<div class="layout">
  <div class="main-col">
    <div class="card">
      <div class="controls">
        <button id="startBtn">Старт</button>
        <button id="pauseBtn" class="reset" disabled>Пауза</button>
        <button id="resetBtn" class="reset">Сброс</button>
        <button id="soundBtn" class="icon-btn" title="Звук удара">🔊</button>
        <label class="slow">
          <input type="checkbox" id="slowChk"> Замедленный режим (0.25×)
        </label>
      </div>
    </div>

    <canvas id="scene" width="1000" height="440"></canvas>

    <div class="card bottom-info-card">
      <div class="status" id="status">Нажмите «Старт»</div>
      <div class="momentum-row">
        Суммарный импульс системы до: <b id="ptotalBefore">—</b> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Суммарный импульс системы после: <b id="ptotalAfter">—</b>
      </div>
    </div>
  </div>

  <div class="side-col">
    <div class="card slider-block">
      <div class="slider-title red">Красная тележка</div>
      <div class="slider-row">
        <div class="label"><span>Масса, кг</span><span class="val" id="m1v">2.0</span></div>
        <input type="range" id="m1" min="0.5" max="10" step="0.5" value="2">
      </div>
      <div class="slider-row">
        <div class="label"><span>Скорость до удара</span><span class="val" id="v1v">2.0</span></div>
        <input type="range" id="v1" min="-10" max="10" step="0.5" value="2">
      </div>
      <div class="after-speed">Скорость после удара:<br><b id="r1after">—</b></div>
    </div>

    <div class="card slider-block">
      <div class="slider-title green">Зелёная тележка</div>
      <div class="slider-row">
        <div class="label"><span>Масса, кг</span><span class="val" id="m2v">2.0</span></div>
        <input type="range" id="m2" min="0.5" max="10" step="0.5" value="2">
      </div>
      <div class="slider-row">
        <div class="label"><span>Скорость до удара</span><span class="val" id="v2v">-2.0</span></div>
        <input type="range" id="v2" min="-10" max="10" step="0.5" value="-2">
      </div>
      <div class="after-speed">Скорость после удара:<br><b id="r2after">—</b></div>

      <div class="mode-block">
        <div class="mode-label">Тип удара</div>
        <div class="switch" id="collisionSwitch">
          <button data-mode="elastic" class="active">Упругий</button>
          <button data-mode="plastic">Неупругий</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="watermark">АлексеЕВа</div>

<script>
(() => {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const ROAD_Y = H - 60;
  const CART_W = 96, CART_H = 60;
  const PADDING = 40;
  const WORLD_WIDTH_M = 20;
  const SCALE = (W - 2 * PADDING) / WORLD_WIDTH_M;

  const DEFAULTS = { m1: 2, v1: 2, m2: 2, v2: -2 };

  const state = {
    m1: DEFAULTS.m1, v1: DEFAULTS.v1,
    m2: DEFAULTS.m2, v2: DEFAULTS.v2,
    initial: { ...DEFAULTS },
    x1: 0, x2: 0,
    curV1: 0, curV2: 0,
    running: false,
    finished: false,
    paused: false,
    hasCollided: false,
    mode: 'elastic',
    slow: false,
    lastTime: 0,
    afterV1: null, afterV2: null,
    wheelPhase1: 0, wheelPhase2: 0,
  };

  const snowflakes = [];
  const MAX_SNOW = 800;
  let snowActive = false;
  let snowTimer = 0;
  const SNOW_RATE = 120;
  
  let particles = [];

  // ---------- Звук удара ----------
  let audioCtx = null;
  let noiseBuf = null;
  let soundOn = localStorage.getItem('impulseSound') !== 'off';

  function initAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      audioCtx = new AC();
      const len = Math.floor(audioCtx.sampleRate * 0.4);
      noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    } catch (e) {
      audioCtx = null;
    }
  }

  function playImpact(mode, relSpeed, slow) {
    if (!soundOn) return;
    initAudio();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const strength = Math.min(1, Math.abs(relSpeed) / 12);
    if (strength < 0.03) return;

    const elastic = (mode === 'elastic');
    const pitchK = slow ? 0.65 : 1.0;
    const stretch = slow ? 1.7 : 1.0;
    const t = audioCtx.currentTime;

    const master = audioCtx.createGain();
    master.gain.value = 0.08 + 0.22 * strength;
    master.connect(audioCtx.destination);

    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuf;
    src.playbackRate.value = pitchK;

    const filt = audioCtx.createBiquadFilter();
    const noiseGain = audioCtx.createGain();

    if (elastic) {
      filt.type = 'bandpass';
      filt.frequency.value = 1800 * pitchK;
      filt.Q.value = 1.2;
      const dur = 0.045 * stretch;
      noiseGain.gain.setValueAtTime(0.0001, t);
      noiseGain.gain.exponentialRampToValueAtTime(0.9, t + 0.003);
      noiseGain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(filt); filt.connect(noiseGain); noiseGain.connect(master);
      src.start(t); src.stop(t + dur + 0.05);
    } else {
      filt.type = 'lowpass';
      filt.frequency.value = 380 * pitchK;
      filt.Q.value = 0.7;
      const dur = 0.18 * stretch;
      noiseGain.gain.setValueAtTime(0.0001, t);
      noiseGain.gain.exponentialRampToValueAtTime(1.0, t + 0.012);
      noiseGain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(filt); filt.connect(noiseGain); noiseGain.connect(master);
      src.start(t); src.stop(t + dur + 0.05);
    }

    const osc = audioCtx.createOscillator();
    const oscGain = audioCtx.createGain();

    if (elastic) {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(900 * pitchK, t);
      osc.frequency.exponentialRampToValueAtTime(450 * pitchK, t + 0.09 * stretch);
      oscGain.gain.setValueAtTime(0.35, t);
      oscGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.09 * stretch);
    } else {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(140 * pitchK, t);
      osc.frequency.exponentialRampToValueAtTime(55 * pitchK, t + 0.26 * stretch);
      oscGain.gain.setValueAtTime(0.75, t);
      oscGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.26 * stretch);
    }

    osc.connect(oscGain); oscGain.connect(master);
    osc.start(t); osc.stop(t + 0.35 * stretch);
  }

  // ---------- UI ----------
  const ui = {
    m1: document.getElementById('m1'),
    m1v: document.getElementById('m1v'),
    v1: document.getElementById('v1'),
    v1v: document.getElementById('v1v'),
    m2: document.getElementById('m2'),
    m2v: document.getElementById('m2v'),
    v2: document.getElementById('v2'),
    v2v: document.getElementById('v2v'),
    startBtn: document.getElementById('startBtn'),
    pauseBtn: document.getElementById('pauseBtn'),
    resetBtn: document.getElementById('resetBtn'),
    soundBtn: document.getElementById('soundBtn'),
    slowChk: document.getElementById('slowChk'),
    switch: document.getElementById('collisionSwitch'),
    status: document.getElementById('status'),
    r1after: document.getElementById('r1after'),
    r2after: document.getElementById('r2after'),
    ptotalBefore: document.getElementById('ptotalBefore'),
    ptotalAfter: document.getElementById('ptotalAfter'),
  };

  function syncSoundBtn() {
    ui.soundBtn.textContent = soundOn ? '🔊' : '🔇';
    ui.soundBtn.classList.toggle('off', !soundOn);
    ui.soundBtn.title = soundOn ? 'Звук удара: включён' : 'Звук удара: выключен';
  }

  function readSliders() {
    state.m1 = parseFloat(ui.m1.value);
    state.v1 = parseFloat(ui.v1.value);
    state.m2 = parseFloat(ui.m2.value);
    state.v2 = parseFloat(ui.v2.value);
    ui.m1v.textContent = state.m1.toFixed(1);
    ui.v1v.textContent = state.v1.toFixed(1);
    ui.m2v.textContent = state.m2.toFixed(1);
    ui.v2v.textContent = state.v2.toFixed(1);
  }

  function clearResults() {
    ui.r1after.textContent = '—';
    ui.r2after.textContent = '—';
    ui.ptotalBefore.textContent = '—';
    ui.ptotalAfter.textContent = '—';
  }

  function setStatus(t) { ui.status.textContent = t; }

  function resetToInitial() {
    state.running = false;
    state.paused = false;
    state.finished = false;
    state.hasCollided = false;
    state.afterV1 = null;
    state.afterV2 = null;
    state.wheelPhase1 = 0;
    state.wheelPhase2 = 0;
    particles = [];

    ui.m1.value = state.initial.m1;
    ui.v1.value = state.initial.v1;
    ui.m2.value = state.initial.m2;
    ui.v2.value = state.initial.v2;
    readSliders();

    state.x1 = 6.0;
    state.x2 = 14.0;
    state.curV1 = state.initial.v1;
    state.curV2 = state.initial.v2;

    clearResults();
    ui.startBtn.disabled = false;
    ui.pauseBtn.disabled = true;
    ui.pauseBtn.textContent = 'Пауза';
    setStatus('Нажмите «Старт»');
    draw(0);
  }

  // ---------- Обработчики ----------
  ['m1','v1','m2','v2'].forEach(id => {
    ui[id].addEventListener('input', () => {
      readSliders();
      if (!state.running && !state.hasCollided) {
        state.curV1 = state.v1;
        state.curV2 = state.v2;
        draw(0);
      }
    });
  });

  ui.slowChk.addEventListener('change', () => { state.slow = ui.slowChk.checked; });

  ui.switch.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-mode]');
    if (!btn) return;
    state.mode = btn.dataset.mode;
    [...ui.switch.querySelectorAll('button')].forEach(b => b.classList.toggle('active', b === btn));
    if (!state.running && !state.hasCollided) draw(0);
  });

  ui.soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    localStorage.setItem('impulseSound', soundOn ? 'on' : 'off');
    syncSoundBtn();
    if (soundOn) initAudio();
  });

  ui.startBtn.addEventListener('click', () => {
    if (state.running) return;
    if (state.paused) {
      state.paused = false;
      state.running = true;
      ui.startBtn.disabled = true;
      ui.startBtn.textContent = 'Старт';
      ui.pauseBtn.disabled = false;
      setStatus(state.hasCollided ? (state.mode === 'elastic' ? 'Упругое соударение' : 'Пластичное соударение') : 'Движение...');
      state.lastTime = performance.now();
      ensureLoop();
      return;
    }
    readSliders();
    initAudio();

    state.initial = { m1: state.m1, v1: state.v1, m2: state.m2, v2: state.v2 };
    state.curV1 = state.v1;
    state.curV2 = state.v2;

    state.x1 = 6.0;
    state.x2 = 14.0;
    state.hasCollided = false;
    state.paused = false;
    state.finished = false;
    state.afterV1 = null;
    state.afterV2 = null;
    state.wheelPhase1 = 0;
    state.wheelPhase2 = 0;
    particles = [];

    ui.ptotalBefore.textContent = `${(state.m1 * state.v1 + state.m2 * state.v2).toFixed(2)} кг·м/с`;
    ui.ptotalAfter.textContent = '—';
    ui.r1after.textContent = '—';
    ui.r2after.textContent = '—';

    state.running = true;
    ui.startBtn.disabled = true;
    ui.startBtn.textContent = 'Старт';
    ui.pauseBtn.disabled = false;
    ui.pauseBtn.textContent = 'Пауза';
    setStatus('Движение...');
    state.lastTime = performance.now();
    ensureLoop();
  });

  ui.pauseBtn.addEventListener('click', () => {
    if (!state.running) return;
    state.running = false;
    state.paused = true;
    ui.pauseBtn.disabled = true;
    setStatus('Анимация на паузе. Нажмите «Старт» для продолжения.');
    ui.startBtn.disabled = false;
    ui.startBtn.textContent = 'Продолжить';
  });

  ui.resetBtn.addEventListener('click', resetToInitial);

  canvas.addEventListener('click', () => {
    snowActive = !snowActive;
    if (snowActive) {
      for (let i = 0; i < 220; i++) {
        spawnFlake(Math.random() * W, Math.random() * H * 0.85);
      }
    } else {
      snowflakes.length = 0;
      snowTimer = 0;
    }
    ensureLoop();
  });

  // ---------- Снег ----------
  function spawnFlake(x, y) {
    if (snowflakes.length >= MAX_SNOW) return;
    snowflakes.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 35,
      vy: 35 + Math.random() * 60,
      r: 1.2 + Math.random() * 2.4,
      alpha: 0.5 + Math.random() * 0.5,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.6 + Math.random() * 1.4,
    });
  }

  function updateSnow(dt) {
    if (snowActive) {
      snowTimer += dt;
      const step = 1 / SNOW_RATE;
      while (snowTimer >= step) {
        snowTimer -= step;
        spawnFlake(Math.random() * W, -10);
      }
    }
    for (let i = snowflakes.length - 1; i >= 0; i--) {
      const s = snowflakes[i];
      s.sway += s.swaySpeed * dt;
      s.x += (s.vx + Math.sin(s.sway) * 18) * dt;
      s.y += s.vy * dt;
      if (s.y > H + 10 || s.x < -30 || s.x > W + 30) {
        snowflakes.splice(i, 1);
      }
    }
  }

  // ---------- Частицы ----------
  function spawnCollisionParticles(xPx, yPx, color) {
    for (let i = 0; i < 30; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 60 + Math.random() * 120;
      particles.push({
        x: xPx, y: yPx,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 80,
        life: 1.0,
        decay: 1.2 + Math.random(),
        size: 2 + Math.random() * 4,
        color: color
      });
    }
  }

  function drawParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= p.decay * dt;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 250 * dt;

      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1.0;
  }

  // ---------- Физика ----------
  function computeAfterCollision() {
    const m1 = state.m1, m2 = state.m2;
    const u1 = state.curV1, u2 = state.curV2;
    if (state.mode === 'elastic') {
      const v1 = ((m1 - m2) * u1 + 2 * m2 * u2) / (m1 + m2);
      const v2 = ((m2 - m1) * u2 + 2 * m1 * u1) / (m1 + m2);
      return [v1, v2];
    }
    const v = (m1 * u1 + m2 * u2) / (m1 + m2);
    return [v, v];
  }

  const SPEED_FACTOR = 0.55;

  // Проверяет, возможно ли ещё столкновение в будущем
  function canStillCollide() {
    const relPos = state.x2 - state.x1;
    const relVel = state.curV2 - state.curV1;
    // Если скорости равны, тележки не сблизятся (расстояние постоянно)
    if (Math.abs(relVel) < 0.001) return false;
    // Сближаются, если относительная позиция и скорость имеют разные знаки
    return relPos * relVel < 0;
  }

  function step(dt) {
    if (!state.running || state.finished) return;
    const ts = state.slow ? 0.25 : 1.0;
    const sdt = dt * ts * SPEED_FACTOR;

    state.x1 += state.curV1 * sdt;
    state.x2 += state.curV2 * sdt;

    state.wheelPhase1 += (state.curV1 * sdt) * SCALE / 14;
    state.wheelPhase2 += (state.curV2 * sdt) * SCALE / 14;

    const halfMeters = (CART_W / SCALE) / 2;
    const gap = Math.abs(state.x1 - state.x2);
    
    // Столкновение: тележки соприкасаются И сближаются
    if (!state.hasCollided && gap <= 2 * halfMeters + 0.02 && canStillCollide()) {
      const relSpeed = state.curV1 - state.curV2;
      playImpact(state.mode, relSpeed, state.slow);

      const [v1, v2] = computeAfterCollision();
      state.afterV1 = v1;
      state.afterV2 = v2;
      state.curV1 = v1;
      state.curV2 = v2;

      const mid = (state.x1 + state.x2) / 2;
      const dir = state.x1 < state.x2 ? -1 : 1;
      state.x1 = mid + dir * (halfMeters + 0.001);
      state.x2 = mid - dir * (halfMeters + 0.001);

      state.hasCollided = true;
      
      const collisionPx = worldToPx(mid);
      spawnCollisionParticles(collisionPx, ROAD_Y - CART_H / 2, '#ffd700');

      showResultsNow();
      setStatus(state.mode === 'elastic' ? 'Упругое соударение' : 'Пластичное соударение');
    }

    // Границы поля для проверки "не столкнутся" — видимые пределы
    const visibleLeft = 0;
    const visibleRight = WORLD_WIDTH_M;
    const outOfVisible = (x) => (x - halfMeters < visibleLeft) || (x + halfMeters > visibleRight);

    if (state.hasCollided) {
      // После удара — ждём, пока обе тележки полностью уйдут с поля
      const farLeft = -3;
      const farRight = WORLD_WIDTH_M + 3;
      const fullyOut = (x) => (x < farLeft - 1) || (x > farRight + 1);
      if (fullyOut(state.x1) && fullyOut(state.x2)) {
        state.finished = true;
        state.running = false;
        ui.pauseBtn.disabled = true;
        ui.startBtn.disabled = true;
        setStatus('Тележки выехали за пределы поля. Нажмите «Сброс».');
      }
    } else {
      // До удара: если хотя бы одна тележка ушла за видимый край И столкновение невозможно
      if ((outOfVisible(state.x1) || outOfVisible(state.x2)) && !canStillCollide()) {
        state.finished = true;
        state.running = false;
        ui.pauseBtn.disabled = true;
        ui.startBtn.disabled = false;
        setStatus('Тележки не столкнутся. Нажмите «Сброс».');
      }
    }
  }

  function showResultsNow() {
    const m1 = state.m1, m2 = state.m2;
    const v1b = state.initial.v1, v2b = state.initial.v2;
    const v1a = state.afterV1, v2a = state.afterV2;

    ui.r1after.textContent = `${v1a.toFixed(2)} м/с`;
    ui.r2after.textContent = `${v2a.toFixed(2)} м/с`;
    ui.ptotalBefore.textContent = `${(m1 * v1b + m2 * v2b).toFixed(2)} кг·м/с`;
    ui.ptotalAfter.textContent = `${(m1 * v1a + m2 * v2a).toFixed(2)} кг·м/с`;
  }

  // ---------- Отрисовка ----------
  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, ROAD_Y);
    sky.addColorStop(0, '#2f4a63');
    sky.addColorStop(0.55, '#5a7896');
    sky.addColorStop(1, '#a7bccf');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, ROAD_Y);

    ctx.fillStyle = 'rgba(240, 246, 252, 0.55)';
    ctx.beginPath();
    ctx.arc(W - 130, 70, 34, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(240, 246, 252, 0.15)';
    ctx.beginPath();
    ctx.arc(W - 130, 70, 56, 0, Math.PI * 2);
    ctx.fill();

    drawCloud(180, 55, 1.0, 'rgba(226, 236, 248, 0.85)');
    drawCloud(430, 90, 0.85, 'rgba(216, 228, 242, 0.8)');
    drawCloud(760, 50, 1.05, 'rgba(230, 240, 250, 0.85)');

    drawForest();

    ctx.fillStyle = '#eef4fb';
    ctx.fillRect(0, ROAD_Y - 8, W, 8);

    const roadGrd = ctx.createLinearGradient(0, ROAD_Y, 0, H);
    roadGrd.addColorStop(0, '#dce7f2');
    roadGrd.addColorStop(1, '#b9cbdc');
    ctx.fillStyle = roadGrd;
    ctx.fillRect(0, ROAD_Y, W, H - ROAD_Y);

    ctx.strokeStyle = 'rgba(150, 170, 190, 0.35)';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 5; i++) {
      const y = ROAD_Y + 18 + i * 9;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
  }

  function drawCloud(x, y, s, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, 20 * s, 0, Math.PI * 2);
    ctx.arc(x + 22 * s, y - 6 * s, 24 * s, 0, Math.PI * 2);
    ctx.arc(x + 48 * s, y, 18 * s, 0, Math.PI * 2);
    ctx.arc(x + 24 * s, y + 7 * s, 20 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSpruce(x, baseY, h, color, shade) {
    const w = h * 0.62;
    const trunkH = h * 0.1;

    ctx.fillStyle = '#2b221c';
    ctx.fillRect(x - 2, baseY - trunkH, 4, trunkH);

    const layers = 5;
    const startY = baseY - trunkH;
    const topY = startY - h * 0.9;
    ctx.fillStyle = color;

    for (let i = 0; i < layers; i++) {
      const t = i / layers;
      const y = startY - (startY - topY) * t;
      const layerTopY = startY - (startY - topY) * Math.min(1, t + 0.35);
      const baseW = w * (1 - t * 0.75);
      const halfW = baseW / 2;

      ctx.beginPath();
      ctx.moveTo(x, layerTopY);
      ctx.quadraticCurveTo(x - halfW * 0.5, y - (y - layerTopY) * 0.3, x - halfW, y);
      const segs = 4;
      for (let s = 0; s < segs; s++) {
        const x1 = x - halfW + (2 * halfW) * (s / segs);
        const x2 = x - halfW + (2 * halfW) * ((s + 0.5) / segs);
        const x3 = x - halfW + (2 * halfW) * ((s + 1) / segs);
        ctx.lineTo(x2, y + 2);
        ctx.lineTo(x3, y);
      }
      ctx.quadraticCurveTo(x + halfW * 0.5, y - (y - layerTopY) * 0.3, x, layerTopY);
      ctx.closePath();
      ctx.fill();
    }

    if (shade) {
      ctx.fillStyle = shade;
      ctx.globalAlpha = 0.35;
      ctx.beginPath();
      ctx.moveTo(x, startY - h * 0.2);
      ctx.lineTo(x - w * 0.5, startY);
      ctx.lineTo(x + w * 0.5, startY);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawForest() {
    const groundY = ROAD_Y - 4;
    const farColor = '#2d4d3a', farShade = '#1e382a';
    const midColor = '#213f2e', midShade = '#142a1e';
    const nearColor = '#163025', nearShade = '#0a1c13';

    for (let i = 0; i < 30; i++) {
      const x = (i * 37 + 12) % (W + 30) - 15;
      const h = 50 + ((i * 41) % 38);
      drawSpruce(x, groundY - 2, h, farColor, farShade);
    }
    for (let i = 0; i < 24; i++) {
      const x = (i * 47 + 25) % (W + 30) - 15;
      const h = 62 + ((i * 31) % 36);
      drawSpruce(x, groundY - 1, h, midColor, midShade);
    }
    for (let i = 0; i < 18; i++) {
      const x = (i * 63 + 40) % (W + 30) - 15;
      const h = 78 + ((i * 27) % 34);
      drawSpruce(x, groundY, h, nearColor, nearShade);
    }
  }

  function worldToPx(xm) { return PADDING + xm * SCALE; }

  function drawCart(xm, mass, colorMain, colorDark, v, wheelPhase) {
    const cx = worldToPx(xm);
    const cartBottom = ROAD_Y + 10;
    const cartTop = cartBottom - CART_H;
    const x = cx - CART_W / 2;
    const wheelR = 15;

    const speedBlur = Math.min(15, Math.abs(v) * 3);
    ctx.shadowColor = 'rgba(0,0,0,0.25)';
    ctx.shadowBlur = 8 + speedBlur;
    ctx.shadowOffsetY = 6;

    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(cx, cartBottom + 8, CART_W * 0.55, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    const grd = ctx.createLinearGradient(0, cartTop, 0, cartBottom);
    grd.addColorStop(0, colorMain);
    grd.addColorStop(1, colorDark);
    ctx.fillStyle = grd;
    roundRect(x, cartTop, CART_W, CART_H, 11);
    ctx.fill();
    
    ctx.shadowColor = 'transparent';

    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    roundRect(x + 8, cartTop + 6, CART_W - 16, 10, 5);
    ctx.fill();

    const wheelY = cartBottom + 2;
    [x + 22, x + CART_W - 22].forEach((wx) => {
      ctx.fillStyle = '#1f242b';
      ctx.beginPath();
      ctx.arc(wx, wheelY, wheelR, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#aab4bf';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(wx, wheelY, wheelR - 3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = '#c9d2db';
      ctx.lineWidth = 2;
      for (let k = 0; k < 4; k++) {
        const a = wheelPhase + k * Math.PI / 4;
        ctx.beginPath();
        ctx.moveTo(wx + Math.cos(a) * 4, wheelY + Math.sin(a) * 4);
        ctx.lineTo(wx + Math.cos(a) * (wheelR - 4), wheelY + Math.sin(a) * (wheelR - 4));
        ctx.stroke();
      }
      ctx.fillStyle = '#e8eef4';
      ctx.beginPath();
      ctx.arc(wx, wheelY, 3, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${mass.toFixed(1)} кг`, cx, cartTop + CART_H / 2 + 2);

    const arrowY = cartTop - 30;
    const dir = Math.sign(v);
    const len = Math.min(140, 30 + Math.abs(v) * 12);

    if (Math.abs(v) > 0.01) {
      const arrowGrad = ctx.createLinearGradient(cx - dir * len / 2, arrowY, cx + dir * len / 2, arrowY);
      arrowGrad.addColorStop(0, 'rgba(255,255,255,0.3)');
      arrowGrad.addColorStop(1, colorDark);

      ctx.strokeStyle = arrowGrad;
      ctx.fillStyle = colorDark;
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      
      ctx.beginPath();
      ctx.moveTo(cx - dir * len / 2, arrowY);
      ctx.lineTo(cx + dir * (len / 2 - 10), arrowY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx + dir * len / 2, arrowY);
      ctx.lineTo(cx + dir * (len / 2 - 14), arrowY - 9);
      ctx.lineTo(cx + dir * (len / 2 - 14), arrowY + 9);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillStyle = colorDark;
      ctx.beginPath();
      ctx.arc(cx, arrowY, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(cx, arrowY, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.font = 'bold 15px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    const speedLabel = (v > 0 ? '+' : '') + v.toFixed(1) + ' м/с';
    
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 4;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(speedLabel, cx, arrowY - 12);
    ctx.shadowColor = 'transparent';
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Ось без разметки и чисел — просто чёткая линия
  function drawAxis() {
    const y = ROAD_Y + 38;
    const xStart = PADDING - 15;
    const xEnd = W - PADDING + 30;

    // Чёткая контрастная линия
    ctx.strokeStyle = '#0a0a0a';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(xStart, y);
    ctx.lineTo(xEnd, y);
    ctx.stroke();

    // Стрелка на конце
    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath();
    ctx.moveTo(xEnd, y);
    ctx.lineTo(xEnd - 14, y - 7);
    ctx.lineTo(xEnd - 14, y + 7);
    ctx.closePath();
    ctx.fill();

    // Подпись оси
    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.fillStyle = '#0a0a0a';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillText('x', xEnd - 22, y - 10);
  }

  function drawSnow() {
    for (const s of snowflakes) {
      ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function draw(dt = 0) {
    drawBackground();
    drawAxis();
    drawCart(state.x1, state.m1, '#e05a5a', '#a52626', state.curV1, state.wheelPhase1);
    drawCart(state.x2, state.m2, '#4fbf72', '#1a7a3a', state.curV2, state.wheelPhase2);
    drawParticles(dt);
    drawSnow();
  }

  // ---------- Цикл анимации ----------
  let rafId = null;

  function loop(now) {
    const dt = Math.min(0.05, (now - state.lastTime) / 1000 || 0);
    state.lastTime = now;

    if (state.running) step(dt);
    updateSnow(dt);
    draw(dt);

    const needLoop = state.running || snowflakes.length > 0 || snowActive || particles.length > 0;
    if (needLoop) {
      rafId = requestAnimationFrame(loop);
    } else {
      rafId = null;
    }
  }

  function ensureLoop() {
    if (!rafId) {
      state.lastTime = performance.now();
      rafId = requestAnimationFrame(loop);
    }
  }

  // ---------- Инициализация ----------
  ui.m1.value = DEFAULTS.m1;
  ui.v1.value = DEFAULTS.v1;
  ui.m2.value = DEFAULTS.m2;
  ui.v2.value = DEFAULTS.v2;
  readSliders();

  state.initial = { ...DEFAULTS };
  state.x1 = 6.0;
  state.x2 = 14.0;
  state.curV1 = DEFAULTS.v1;
  state.curV2 = DEFAULTS.v2;

  clearResults();
  setStatus('Нажмите «Старт»');
  syncSoundBtn();
  draw(0);
})();
</script>
